<!doctype html>
<html lang="fr">
  <!-- La langue s'écrit ici, pas dans app.json (web.lang) : app.json entre dans l'empreinte des téléphones. -->

  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Coef</title>
    <!--
      Le site publié vit sous /app sur GitHub Pages, qui ne sait pas renvoyer toutes les adresses vers
      cette page : une adresse profonde (/app/stats) tombe sur la page 404 du site public, qui revient
      ici avec le chemin dans `?__chemin=` (`scripts/site/404.html`). Le chemin est remis dans la barre
      avant que Coef démarre : le routeur le lit comme si on l'avait ouvert directement.
    -->
    <script>
      (function () {
        try {
          var chemin = new URLSearchParams(location.search).get('__chemin');
          if (chemin && chemin.charAt(0) === '/' && chemin.charAt(1) !== '/') {
            history.replaceState(null, '', location.pathname.replace(/\/$/, '') + chemin + location.hash);
          }
        } catch (e) { /* l'accueil du site s'ouvre, faute de mieux */ }
      })();
    </script>
    <!--
      Le modèle d'Expo, au fond près (l'audit de performance du 23/11) : le sien laissait la page
      blanche, même en sombre, le temps que tout Coef arrive. Le fond de Coef d'emblée (`plan`, clair
      ou sombre selon l'ordinateur), et rien d'autre : pas de texte, qu'il faudrait faire valider.
    -->
    <meta name="color-scheme" content="light dark" />
    <!--
      L'icône de Coef dans l'onglet, que le rond d'une séance remplace le temps de la séance
      (`src/site/seance.ts`). L'installation de Coef (le manifeste, le service worker) est retirée
      le 23/11 (Noé : « on la fera plus tard ») : elle est dans l'historique, au commit e25923ff.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/app/icones/coef-32.png" />
    <link rel="apple-touch-icon" href="/app/icones/coef-180.png" />
